<app-navbar></app-navbar>
<div class="body-container">
    <div class="logo-container">
        <img src="/LogoAP.png" alt="Logo de Andrés Publicidad">
    </div>
    <div class="edit-hora-form">
        <h2>Agregar un registro</h2>
        <form (ngSubmit)="addRegistro()">
            <div class="form-group">
                <label for="Hid">id</label>
                <input type="text" id="Hid" name="Hid" required class="form-control" [(ngModel)]="newRegistro.Hid" readonly/>
            </div>
            <div class="form-group">
                <label for="name">Nombre</label>
                <select name="Name" id="name" required class="form-control" [(ngModel)]="newRegistro.Name" (change)="onNombreChange($event)">
                    <input type="text"><option *ngFor="let usuario of usuarios" [value]="usuario.nombre">{{usuario.nombre}}</option>
                </select>
                <!-- <input type="text" id="name" name="Name" required class="form-control" [(ngModel)]="newRegistro.Name"/> -->
            </div>
            <div class="form-group">
                <label for="entrada">Entrada</label>
                <input type="time" id="entrada" name="Entrada" required class="form-control" [(ngModel)]="newRegistro.Entrada"/>
            </div>
            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input type="text" id="fecha" name="Fecha" required class="form-control" [(ngModel)]="newRegistro.Fecha"/>
            </div>
            <div class="form-group">
                <label for="salida">Salida</label>
                <input type="time" id="salida" name="Salida" required class="form-control" [(ngModel)]="newRegistro.Salida"/>
            </div>
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Agregar</button>
                <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancelar</button>
            </div>
        </form>
        <!-- <app-spinner *ngIf="loading"></app-spinner> -->
    </div>
</div>
