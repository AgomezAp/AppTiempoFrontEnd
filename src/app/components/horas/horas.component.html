<app-navbar></app-navbar>
<div *ngIf="!loading" class="horas-dashboard">
    <h1>{{ showList ? 'Registro de Horas' : 'Horarios por ID'}}</h1>
    <div class="table-container">
      <div class="table-responsive">
        <table class="table table-bordered">
          <thead>
            <tr>
              <th scope="col">Id</th>
              <th scope="col">Nombre</th>
              <th scope="col">Entrada</th>
              <th scope="col">Salida</th>
              <th scope="col">Fecha</th>
              <th scope="col">Extras</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of listHoras">
              <th scope="row">{{item.ID}}</th>
              <td>{{item.Name}}</td>
              <td>{{item.Entrada}}</td>
              <td>{{item.Salida}}</td>
              <td>{{item.Fecha}}</td>
              <td>{{item.Extra}}</td>
              <td>
                <button class="btn btn-warning action-button"  (click)="navigateToEditSalida(item.ID, item.Fecha)">Modificar</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
