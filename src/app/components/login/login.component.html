<div class="login-page">
  <!-- Fondo con patrón (se maneja con CSS) -->

  <!-- Contenedor principal -->
  <div class="login-wrapper">
    <!-- Logo -->
    <div class="logo-container">
      <img src="/LogoAP.png" alt="Logo de Andrés Publicidad" />
    </div>

    <!-- Card de Login -->
    <div class="login-card">
      <h2>Iniciar Sesión</h2>

      <form (ngSubmit)="logIn()">
        <div class="form-group">
          <label for="email">Correo</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Ingresa tu correo electrónico"
            [(ngModel)]="email"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="btn-login" [disabled]="loading">
          <span *ngIf="!loading">Ingresar</span>
          <span *ngIf="loading">Ingresando...</span>
        </button>
      </form>

      <!-- Links opcionales -->
      <div class="login-links">
        <!-- <a routerLink="/signup">¿No tienes una cuenta? Regístrate</a> -->
        <!-- <a routerLink="/reestablecerContraseña">¿Olvidaste tu contraseña?</a> -->
      </div>
    </div>

    <!-- Footer opcional -->
    <p class="login-footer">
      © 2026 Andrés Publicidad. Todos los derechos reservados.
    </p>
  </div>
</div>

<app-spinner *ngIf="loading"></app-spinner>
