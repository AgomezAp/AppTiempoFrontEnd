<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.component.css"> <!-- Enlace al archivo CSS -->
</head>
<body>
    <div class="logo-container">
        <img src="/LogoAP.png" alt="Logo de Andrés Publicidad">
    </div>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
            <label for="email">Correo</label>
            <input type="text" id="email" name="email" placeholder="Ingresa tu correo electrónico"   [(ngModel)]="email" required>
            
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" [(ngModel)]="password" required>
            
            <input type="submit" (click)="logIn()" value="Ingresar">
        <div class="link">
            <p>¿No tienes una cuenta? <a routerLink="/signup">Regístrate</a></p>
        </div>
    </div>
    <app-spinner *ngIf = "loading" ></app-spinner>
</body>

</html>
