<app-navbar></app-navbar>
<div class="body-container">
    <div class="logo-container">
        <img src="/LogoAP.png" alt="Logo de Andrés Publicidad">
    </div>
    
    <div class="informes-container">
        <h5>tipo de informe</h5>
        <div class="tipo">
            <button class="button-tipo" type="button" (click)="seleccionarTipoInforme('personal')"><i class="fa fa-clock"></i></button>
            <button class="button-tipo" type="button" (click)="seleccionarTipoInforme('novedad')"><i class="fas fa-bell"></i></button>
            <button class="button-tipo" type="button" (click)="seleccionarTipoInforme('riesgo')"><i class="fas fa-exclamation-triangle"></i></button>
        </div>
        <h2>{{tipo.toLocaleUpperCase()}}</h2>
        <form (ngSubmit)="generarInforme()">
            <div class="form-group" *ngIf="tipo==='personal'" style="display: none;">
                <label for="id">id</label>
                <input type="text" id="id" name="id" class="form-control" placeholder="id" [(ngModel)]="id"  required readonly >
            </div>
            <div class="form-group" *ngIf="tipo==='personal'">
                <label for="name">Nombre</label>
                <div class="input-group">
                    <select name="Name" id="name" required class="form-control" (change)="onNombreChange($event)" [(ngModel)]="name">
                        <option *ngFor="let usuario of usuarios" [value]="usuario.nombre">{{usuario.nombre}}</option>
                    </select>
                    <button type="button" class="btn btn-secondary" (click)="agregarNombre()">+</button>
                </div>
                <div *ngFor="let nm of nombres">
                    <span>{{nm}}</span>
                </div>
            </div>

            <div class="form-group">
                <label for="startDate">Fecha de Inicio:</label>
                <input type="date" id="startDate" name="startDate" class="form-control" placeholder="startDate" [(ngModel)]="fechaInicial" required>
            </div>
            <div class="form-group">
                <label for="endDate">Fecha de Fin:</label>
                <input type="date" id="endDate" name="endDate" class="form-control" placeholder="endDate" [(ngModel)]="fechaFinal" required>
            </div>
            <div class="button-group">
                <button type="submit" class="btn btn-primary" [disabled]="loading">{{ loading ? 'Generando...' : 'Generar Informe'}}</button>
                <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancelar</button>
            </div>
        </form>
    </div>
</div>
