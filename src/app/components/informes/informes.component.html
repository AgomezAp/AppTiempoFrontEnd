<app-navbar></app-navbar>

<div class="informes-container">
  <!-- Header con logo y título -->
  <div class="header-section">
    <div class="logo-wrapper">
      <img src="/LogoAP.png" alt="Logo de Andrés Publicidad" />
    </div>
    <h1 class="page-title">Generador de Informes</h1>
  </div>

  <!-- Selector de tipo de informe -->
  <div class="tipo-selector">
    <span class="tipo-label">Tipo de informe:</span>
    <div class="tipo-buttons">
      <button
        class="tipo-btn"
        [class.active]="tipo === 'personal'"
        type="button"
        (click)="seleccionarTipoInforme('personal')"
        title="Personal"
      >
        <i class="fa fa-clock"></i>
        <span>Personal</span>
      </button>
      <button
        class="tipo-btn"
        [class.active]="tipo === 'novedad'"
        type="button"
        (click)="seleccionarTipoInforme('novedad')"
        title="Novedad"
      >
        <i class="fas fa-bell"></i>
        <span>Novedad</span>
      </button>
      <button
        class="tipo-btn"
        [class.active]="tipo === 'riesgo'"
        type="button"
        (click)="seleccionarTipoInforme('riesgo')"
        title="Riesgo"
      >
        <i class="fas fa-exclamation-triangle"></i>
        <span>Riesgo</span>
      </button>
    </div>
  </div>

  <!-- Formulario -->
  <div class="form-card">
    <div class="form-header">
      <h2>{{ tipo.toUpperCase() }}</h2>
    </div>

    <form (ngSubmit)="generarInforme()">
      <!-- Campo oculto ID -->
      <input
        type="hidden"
        id="id"
        name="id"
        [(ngModel)]="id"
        *ngIf="tipo === 'personal'"
      />

      <!-- Selector de nombres (solo para personal) -->
      <div class="form-group" *ngIf="tipo === 'personal'">
        <div class="label-row">
          <label for="name">Nombre</label>
          <div class="checkbox-inline">
            <input
              type="checkbox"
              id="selectAll"
              (change)="toggleSeleccionarTodos($event)"
            />
            <label for="selectAll">Seleccionar todos</label>
          </div>
        </div>

        <div class="select-row">
          <select
            name="Name"
            id="name"
            required
            (change)="onNombreChange($event)"
            [(ngModel)]="name"
          >
            <option value="" disabled>Seleccione un usuario</option>
            <option *ngFor="let usuario of usuarios" [value]="usuario.nombre">
              {{ usuario.nombre }}
            </option>
          </select>
          <button
            type="button"
            class="btn-add"
            (click)="agregarNombre()"
            title="Agregar"
          >
            <i class="fas fa-plus"></i>
          </button>
        </div>

        <!-- Tags de nombres seleccionados -->
        <div class="nombres-tags" *ngIf="nombres.length > 0">
          <span *ngFor="let nm of nombres; let i = index" class="nombre-tag">
            {{ nm }}
            <button
              type="button"
              class="tag-remove"
              (click)="eliminarNombre(i)"
              title="Quitar"
            >
              <i class="fas fa-times"></i>
            </button>
          </span>
        </div>
      </div>

      <!-- Fechas en una fila -->
      <div class="form-row">
        <div class="form-group">
          <label for="startDate">Fecha Inicio</label>
          <input
            type="date"
            id="startDate"
            name="startDate"
            [(ngModel)]="fechaInicial"
            required
          />
        </div>
        <div class="form-group">
          <label for="endDate">Fecha Fin</label>
          <input
            type="date"
            id="endDate"
            name="endDate"
            [(ngModel)]="fechaFinal"
            required
          />
        </div>
      </div>

      <!-- Botones -->
      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="loading">
          <i class="fas fa-file-alt" *ngIf="!loading"></i>
          <i class="fas fa-spinner fa-spin" *ngIf="loading"></i>
          {{ loading ? "Generando..." : "Generar Informe" }}
        </button>
        <button type="button" class="btn-secondary" (click)="cancelEdit()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
