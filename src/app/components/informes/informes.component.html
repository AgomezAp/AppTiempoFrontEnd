<app-navbar></app-navbar>
<div class="body-container">
  <div class="logo-container">
    <img src="/LogoAP.png" alt="Logo de Andrés Publicidad" />
  </div>

  <div class="informes-container">
    <h5>tipo de informe</h5>
    <div class="tipo">
      <button
        class="button-tipo"
        type="button"
        (click)="seleccionarTipoInforme('personal')"
      >
        <i class="fa fa-clock"></i>
      </button>
      <button
        class="button-tipo"
        type="button"
        (click)="seleccionarTipoInforme('novedad')"
      >
        <i class="fas fa-bell"></i>
      </button>
      <button
        class="button-tipo"
        type="button"
        (click)="seleccionarTipoInforme('riesgo')"
      >
        <i class="fas fa-exclamation-triangle"></i>
      </button>
    </div>
    <h2>{{ tipo.toLocaleUpperCase() }}</h2>
    <form (ngSubmit)="generarInforme()">
      <div class="form-group" *ngIf="tipo === 'personal'" style="display: none">
        <label for="id">id</label>
        <input
          type="text"
          id="id"
          name="id"
          class="form-control"
          placeholder="id"
          [(ngModel)]="id"
          required
          readonly
        />
      </div>
      <!-- <div class="form-group" *ngIf="tipo==='personal'">
                <label for="name">Nombre</label>
                
                <select class="input-group" style="max-height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; border-radius: 5px;"> 
                    <ul class="list-group">
                        <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let usuario of usuarios">
                            {{usuario.nombre}}
                            <input type="checkbox" [value]="usuario.nombre" (change)="onCheckboxChange($event, usuario)" [checked]="seleccionados.includes(usuario.nombre)">
                        </li>
                    </ul>

                </select>
                <button type="button" class="btn btn-secondar" (click)="agregarNombres()">+</button>
                <div *ngFor="let nm of nombres" class="mt-2">
                    <span>{{nm}}</span>
                </div>
            </div> -->
      <div class="form-group" *ngIf="tipo === 'personal'">
        <label for="name">Nombre</label>
        <div class="checkbox-container">
          <input
            type="checkbox"
            id="selectAll"
            (change)="toggleSeleccionarTodos($event)"
          />
          <label for="selectAll">Seleccionar todos</label>
        </div>
        <div class="input-group">
          <select
            name="Name"
            id="name"
            required
            class="form-control"
            (change)="onNombreChange($event)"
            [(ngModel)]="name"
          >
            <option *ngFor="let usuario of usuarios" [value]="usuario.nombre">
              {{ usuario.nombre }}
            </option>
          </select>
          <button
            type="button"
            class="btn btn-secondary"
            (click)="agregarNombre()"
          >
            +
          </button>
        </div>
        <div class="nombres-scroll">
          <span *ngFor="let nm of nombres; let i = index" class="nombre-tag">
            {{ nm }}
            <button
              type="button"
              class="remove-btn"
              (click)="eliminarNombre(i)"
              title="Quitar"
            >
              <i class="fas fa-times"></i>
            </button>
          </span>
        </div>
      </div>

      <div class="date-row">
        <div class="form-group">
          <label for="startDate">Fecha de Inicio:</label>
          <input
            type="date"
            id="startDate"
            name="startDate"
            class="form-control"
            placeholder="startDate"
            [(ngModel)]="fechaInicial"
            required
          />
        </div>
        <div class="form-group">
          <label for="endDate">Fecha de Fin:</label>
          <input
            type="date"
            id="endDate"
            name="endDate"
            class="form-control"
            placeholder="endDate"
            [(ngModel)]="fechaFinal"
            required
          />
        </div>
      </div>
      <div class="button-group">
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          {{ loading ? "Generando..." : "Generar Informe" }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancelEdit()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
