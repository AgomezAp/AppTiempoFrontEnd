<app-navbar></app-navbar>
<div class="body-container">
  <div class="logo-container">
    <img src="/LogoAP.png" alt="Logo de Andrés Publicidad">
  </div>
  <div class="add-novedad-container">
    <div class="add-novedad-form">
      <h2>Agregar Novedad</h2>
      <button type="reset" id="limpiar" (click)="resetForm()">
        <i class="fas fa-broom"></i>
      </button>
      <form>
        <div class="form-row">
          <div class="form-group">
            <label for="name">Nombre:</label>
            <input type="text" id="name" [(ngModel)]="newNovedad.Name" name="name" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="id">ID:</label>
            <input type="number" id="number" [(ngModel)]="newNovedad.Nid" name="id" class="form-control" required >
          </div>
          <div class="form-group">
            <label for="type">Tipo:</label>
            <input type="text" id="type" [(ngModel)]="newNovedad.type" name="type" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="Fecha">Fecha:</label>
            <input type="date" id="Fecha" [(ngModel)]="newNovedad.Fecha" name="Fecha" class="form-control" required>
          </div>
        </div>
        <div class="form-group">
          <label for="description">Descripción:</label>
          <textarea id="description" [(ngModel)]="newNovedad.description" name="description" class="form-control" required></textarea>
        </div>
        <div class="button-group">
          <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
          <button type="submit" class="btn btn-success">Agregar</button>
        </div>
      </form>
      <button class="btn btn-add" (click)="resetForm()">+</button>
      <div class="spinner-container" *ngIf="loading">
        <app-spinner></app-spinner>
      </div>
    </div>
  </div>
</div>
