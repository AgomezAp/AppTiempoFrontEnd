<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <link rel="stylesheet" href="reset-password.component.css"> <!-- Enlace al archivo CSS -->
</head>
<body>
    <div class="logo-container">
        <img src="/LogoAP.png" alt="Logo de Andrés Publicidad">
    </div>
    <div class="reset-password-container">
        <h2>Restablecer Contraseña</h2>
        <form (ngSubmit)="onSubmit()" #resetPasswordForm="ngForm">
            <div class="form-group">
                <label for="email">Correo</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" class="form-control" placeholder="Ingresa tu correo electrónico" required>
                <div *ngIf="resetPasswordForm.submitted && !email" class="text-danger">
                    El correo es obligatorio.
                </div>
            </div>
            <div class="form-group">
                <label for="newPassword">Nueva Contraseña</label>
                <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" class="form-control" placeholder="Ingresa tu nueva contraseña" required>
                <div *ngIf="resetPasswordForm.submitted && !newPassword" class="text-danger">
                    La nueva contraseña es obligatoria.
                </div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirma tu nueva contraseña" required>
                <div *ngIf="resetPasswordForm.submitted && !confirmPassword" class="text-danger">
                    Confirmar la contraseña es obligatorio.
                </div>
                <div *ngIf="resetPasswordForm.submitted && newPassword !== confirmPassword" class="text-danger">
                    Las contraseñas no coinciden.
                </div>
            </div>
            <button type="submit" class="btn btn-primary" [disabled]="loading">Restablecer</button>
        </form>
        <div class="link">
            <p>¿Ya tienes una cuenta? <a routerLink="/logIn">Iniciar sesión</a></p>
        </div>
    </div>
    <app-spinner *ngIf="loading"></app-spinner>
</body>

</html>
