<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Salida</title>
    <link rel="stylesheet" href="edit-salida.component.css"> <!-- Enlace al archivo CSS -->
</head>
<body>
    <div class="logo-container">
        <img src="/LogoAP.png" alt="Logo de Andrés Publicidad">
    </div>
    <div class="edit-hora-form">
        <h2>Modificar Salida</h2>
        <form *ngIf="editingSalida" (ngSubmit)="updateSalida()">
            <div class="form-group">
                <label for="id">ID:</label>
                <input type="number" id="id" [(ngModel)]="editingSalida.ID" name="ID" readonly />
            </div>
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input type="text" id="name" [(ngModel)]="editingSalida.Name" name="Name" readonly />
            </div>
            <div class="form-group">
                <label for="entrada">Entrada:</label>
                <input type="text" id="entrada" [(ngModel)]="editingSalida.Entrada" name="Entrada" readonly />
            </div>
            <div class="form-group">
                <label for="fecha">Fecha:</label>
                <input type="text" id="fecha" [(ngModel)]="editingSalida.Fecha" name="Fecha" readonly />
            </div>
            <div class="form-group">
                <label for="salida">Salida:</label>
                <input type="time" id="salida" [(ngModel)]="editingSalida.Salida" name="Salida" required />
            </div>
            <div class="button-group">
                <button type="submit" class="btn btn-primary" [disabled]="!editingSalida.Salida">Actualizar</button>
                <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancelar</button>
            </div>
        </form>
        <!-- <app-spinner *ngIf="loading"></app-spinner> -->
    </div>
</body>
</html>
