<app-navbar></app-navbar>

<div *ngIf="loading" class="novedad-dashboard">
  <!-- Header con título y filtros en línea -->
  <div class="header-section">
    <h1>Novedades</h1>

    <div class="filters-inline">
      <div class="filter-item" *ngIf="showList">
        <label for="name">Nombre</label>
        <input
          id="name"
          [(ngModel)]="filterName"
          (input)="filterdByName()"
          type="text"
          placeholder="Buscar..."
        />
      </div>
      <div class="filter-item">
        <label for="fecha">Fecha</label>
        <input
          id="fecha"
          type="date"
          [(ngModel)]="fecha"
          (change)="filterByData()"
        />
      </div>
      <button type="button" class="btn-actualizar" (click)="crearNovedad()">
        <i class="fas fa-sync-alt"></i> Actualizar
      </button>
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-container">
    <table class="novedades-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Tipo</th>
          <th>Fecha</th>
          <th>Descripción</th>
          <th>Horas</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let item of filteredNovedad"
          [class]="getRowClass(item.aceptacion)"
        >
          <td class="name-cell">{{ item.Name }}</td>
          <td class="type-cell">{{ item.type }}</td>
          <td class="date-cell">{{ item.Fecha }}</td>
          <td class="desc-cell">{{ item.description }}</td>
          <td class="hours-cell">
            <input
              type="text"
              class="hours-input"
              [(ngModel)]="item.horas"
              (blur)="validarYActualizarHora(item.id, item.horas)"
              placeholder="+/-HH:MM"
              pattern="^-?(0[0-9]|1[0-9]|2[0-3]):(00|30)$"
              title="Formato: HH:MM"
            />
          </td>
          <td class="status-cell">
            <span
              class="status-badge pendiente"
              *ngIf="item.aceptacion === null"
              >Pendiente</span
            >
            <span class="status-badge aceptado" *ngIf="item.aceptacion === true"
              >Descontar</span
            >
            <span
              class="status-badge rechazado"
              *ngIf="item.aceptacion === false"
              >No descontar</span
            >
          </td>
          <td class="actions-cell">
            <button
              class="action-btn accept"
              *ngIf="item.aceptacion === null || item.aceptacion === false"
              (click)="editarEstado(item, true)"
              title="Aceptar"
            >
              <i class="fas fa-check-circle"></i>
            </button>
            <button
              class="action-btn reject"
              *ngIf="item.aceptacion === null || item.aceptacion === true"
              (click)="editarEstado(item, false)"
              title="Rechazar"
            >
              <i class="fas fa-times-circle"></i>
            </button>
            <button
              class="action-btn undo"
              *ngIf="item.aceptacion !== null"
              (click)="editarEstado(item, null)"
              title="Pendiente"
            >
              <i class="fas fa-undo"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botón de acción principal -->
  <div class="footer-actions">
    <button class="btn-aceptar" (click)="enviarAceptacion()">
      <i class="fas fa-paper-plane"></i> ACEPTAR
    </button>
  </div>
</div>
