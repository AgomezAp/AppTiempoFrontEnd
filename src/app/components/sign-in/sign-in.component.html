<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link rel="stylesheet" href="sign-in.component.css" />
    <!-- Enlace al archivo CSS -->
  </head>

  <body>
    <div class="logo-container">
      <img src="/LogoAP.png" alt="Logo de Andrés Publicidad" />
    </div>
    <div class="register-container">
      <h2>Crear una Cuenta</h2>
      <form action="" method="">
        <div class="row g-3">
          <div class="col">
            <label for="name"> </label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Ingresa tu nombre"
              [(ngModel)]="name"
              required
            />
          </div>
          <div class="col">
            <label for="apellido"></label>
            <input
              type="text"
              id="apellido"
              name="apellido"
              placeholder="Ingresa tu apellido"
              [(ngModel)]="lastName"
              required
            />
          </div>
        </div>
        <div class="form-group flex-container">
          <div class="flex-item">
            <label for="role">Rol:</label>
            <select id="role" name="role" class="form-control" [(ngModel)]="Rid" required>
              <option value="" disabled selected>Seleccione el rol</option>
              <option *ngFor="let role of roleList" [value]="role.Rid">{{ role.Rname }}</option>
            </select>
          </div>
          <div class="flex-item">
            <label for="area">Área:</label>
            <select id="area" name="area" class="form-control" [(ngModel)]="Aid" required>
              <option value="" disabled selected>Seleccione el área</option>
              <option *ngFor="let area of areaList" [value]="area.Aid">{{ area.Aname }}</option>
            </select>
          </div>
        </div>
        
        <div class="form-group">
          <label for="email">Correo:</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="Ingresa tu correo"
            [(ngModel)]="email"
            required
          />
        </div>
        

        <div class="row g-3">
          <div class="col md-">
            <label for="password"></label>
            <input
              type="password"
              id="password" 
              name="password"
              placeholder="Crea una contraseña"
              [(ngModel)]="password"
              required
            />
          </div>
          <div class="col">
            <label for="confirm-password"></label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Confirma tu contraseña"
              [(ngModel)]="repeatPassword"
              required
            />
          </div>
        </div>
        <input type="submit" (click)="agregarUsuario()" value="Registrarse" />
      </form>
      <div class="link">
        <p>¿Ya tienes una cuenta? <a href="/logIn">Inicia sesión</a></p>
      </div>
    </div>
    <app-spinner *ngIf="loading"></app-spinner>
  </body>
</html>
