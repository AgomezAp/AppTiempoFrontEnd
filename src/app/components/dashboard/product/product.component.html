<div class="product-dashboard">
  <h1>Inventario</h1>

  <div class="filter-container">
    <input type="text" [(ngModel)]="filterText" (input)="applyFilter()" placeholder="Filtrar por categoría" class="form-control">
  </div>

  <div class="table-container">
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th scope="col">Id</th>
            <th scope="col">Nombre</th>
            <th scope="col">Marca</th>
            <th scope="col">Categoría</th>
            <th scope="col">Cantidad
              <button class="btn btn-outline-dark" *ngIf="sortOrder !== 'asc' && sortOrder !== 'desc'" (click)="sortProducts('asc')">↑</button>
              <button class="btn btn-outline-dark" *ngIf="sortOrder === 'asc'" (click)="sortProducts('desc')">↓</button>
              <button class="btn btn-outline-dark" *ngIf="sortOrder === 'desc'" (click)="sortProducts('')">↔</button>
            </th>
            <th scope="col">Código QR</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of filteredProducts | paginate: { itemsPerPage: itemsPerPage, currentPage: p }">
            <th scope="row">{{ item.id }}</th>
            <td>{{ item.name }}</td>
            <td>{{ item.brand }}</td>
            <td>{{ item.category }}</td>
            <td>{{ item.quantity }}</td>
            <td>
              <img [src]="item.qrCode" alt="Código QR" width="100" height="100">
            </td>
            <td>
              <button class="btn btn-warning action-button" (click)="navigateToEditProduct(item.id)">Modificar</button>
              <button class="btn btn-danger action-button" (click)="navigateToDeleteProduct(item.id)">Eliminar</button>
            </td>
          </tr>
        </tbody>
        <app-spinner *ngIf="loading"></app-spinner>
      </table>
      <div class="pagination-container">
        <pagination-controls (pageChange)="p = $event"></pagination-controls>
      </div>
    </div>
  </div>
  <div *ngIf="filterText" class="total-container">
    <p>Total de productos filtrados: {{ totalQuantity }}</p>
  </div>
  <div class="button-container">
    <button class="btn btn-success" (click)="navigateToAddProduct()">Agregar Producto</button>
  </div>
  <div class="chart-container">
    <canvas baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="'bar'">
    </canvas>
  </div>
</div>
